app = "finsight-backend"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
SPRING_PROFILES_ACTIVE = "prod"
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true

# ------------------------------------------------------------------
# CRÍTICO PARA EL BOT
#
# El bot de Telegram usa LONG POLLING: es él quien sale a consultar a
# Telegram, no al revés. No genera tráfico HTTP entrante.
#
# Si Fly apaga la máquina por "inactividad" (que mide en requests HTTP),
# el bot deja de hacer polling y queda MUERTO — y nada lo despierta,
# porque no hay request que lo levante.
#
# Por eso: la máquina NUNCA se apaga sola.
# ------------------------------------------------------------------
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "60s"      # Spring Boot + Liquibase tardan en arrancar
interval = "30s"
method = "GET"
timeout = "10s"
path = "/actuator/health"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"              # 512mb NO alcanza: JVM + Hibernate + Mongo + Redis