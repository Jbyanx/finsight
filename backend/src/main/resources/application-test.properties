spring.datasource.url=jdbc:h2:mem:finsight_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.data.mongodb.uri=mongodb://localhost:27017/finsight_test
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=test-secret-key-minimum-256-bits-long-enough-for-hmac-sha
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

google.client.id=test-client-id
google.client.secret=test-client-secret

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

app.cors.allowed-origins=http://localhost:3000
scheduler.token-cleanup.cron=0 0 0 * * *

telegram.bot.token=
telegram.bot.enabled=false

spring.ai.google.genai.api-key=test-dummy-key
#spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.GoogleGenAiChatAutoConfiguration