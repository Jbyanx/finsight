# ================================================================
# Finsight ? Base Configuration
# Profile activo: dev por defecto, prod en Fly.io
# ================================================================

spring.application.name=finsight
server.port=8080

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Perfil activo ? sobreescribir con SPRING_PROFILES_ACTIVE=prod en Fly.io
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri="{baseUrl}/login/oauth2/code/google"

# Scheduler
scheduler.token-cleanup.cron=${SCHEDULER_TOKEN_CLEANUP_CRON:0 0 0 * * *}

# Actuator base
management.endpoints.web.base-path=/actuator

# Telegram link code
telegram.link-code.expiration-minutes=${TELEGRAM_LINK_CODE_EXPIRATION_MINUTES:5}
telegram.link-code.chars=ABCDEFGHJKLMNPQRSTUVWXYZ23456789

# Telegram bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}

# Spring AI - Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
#spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7

#LIQUIBASE
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml