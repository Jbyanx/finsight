# ================================================================
# Finsight ? Base Configuration
# Profile activo: dev por defecto, prod en Railway
# ================================================================

spring.application.name=finsight
server.port=8080

# Perfil activo ? sobreescribir con SPRING_PROFILES_ACTIVE=prod en Railway
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Scheduler
scheduler.token-cleanup.cron=${SCHEDULER_TOKEN_CLEANUP_CRON:0 0 0 * * *}

# Actuator base
management.endpoints.web.base-path=/actuator

# Telegram link code
telegram.link-code.expiration-minutes=${TELEGRAM_LINK_CODE_EXPIRATION_MINUTES:5}
telegram.link-code.chars=ABCDEFGHJKLMNPQRSTUVWXYZ23456789

# Telegram bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}