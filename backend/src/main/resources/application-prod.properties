# ================================================================
# Finsight ? Production Profile
# ================================================================

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA ? nunca tocar el schema en produccion
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Logs ? minimos en prod, sin datos sensibles
logging.level.root=WARN
logging.level.dev.jbyanx.finsight=INFO
logging.level.org.springframework.security=WARN

# Actuator ? solo health en prod
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS ? restringido al dominio real
app.cors.allowed-origins=${ALLOWED_ORIGINS}
server.forward-headers-strategy=framework