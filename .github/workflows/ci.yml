name: CD

# Despliega a Railway cuando main avanza (merge de un PR ya validado por el CI).
# El CI corre en PRs contra develop/main; esto corre DESPUÉS del merge.
on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite disparar un deploy manual desde la UI

concurrency:
  group: production-deploy
  cancel-in-progress: false   # nunca cancelar un deploy a medias

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finsight_test
          POSTGRES_USER: finsight_user
          POSTGRES_PASSWORD: finsight_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Red de seguridad: main podría recibir un hotfix directo sin pasar por PR.
      # Nunca desplegamos algo que no compile y pase la suite.
      - name: Build and test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: finsight_test
          DB_USERNAME: finsight_user
          DB_PASSWORD: finsight_test_password
          MONGODB_URI: mongodb://localhost:27017/finsight_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-minimum-256-bits-long-enough
          JWT_ACCESS_EXPIRATION_MS: 900000
          JWT_REFRESH_EXPIRATION_MS: 2592000000
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          ALLOWED_ORIGINS: http://localhost:3000
          SCHEDULER_TOKEN_CLEANUP_CRON: 0 0 0 * * *
        run: mvn clean verify

  deploy:
    name: Deploy to Railway
    needs: verify          # si la suite falla, NO se despliega
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE }} --detach

      # Liquibase corre al arrancar la app y aplica las migraciones pendientes.
      # Si el schema no valida contra las entidades, el contenedor no levanta y
      # Railway conserva el despliegue anterior.
