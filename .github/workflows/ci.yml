name: CI

# Valida cada PR antes del merge. No despliega nada.
on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finsight_test
          POSTGRES_USER: finsight_user
          POSTGRES_PASSWORD: finsight_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Con Liquibase activo y ddl-auto=validate, este paso tambien verifica que
      # las migraciones apliquen sobre una BD limpia y que el schema resultante
      # valide contra las entidades JPA. Es el escenario de produccion, en cada PR.
      - name: Build and test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: finsight_test
          DB_USERNAME: finsight_user
          DB_PASSWORD: finsight_test_password
          MONGODB_URI: mongodb://localhost:27017/finsight_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-minimum-256-bits-long-enough
          JWT_ACCESS_EXPIRATION_MS: 900000
          JWT_REFRESH_EXPIRATION_MS: 2592000000
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          ALLOWED_ORIGINS: http://localhost:3000
          SCHEDULER_TOKEN_CLEANUP_CRON: 0 0 0 * * *
        run: mvn clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/
